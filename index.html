<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WebCut Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
        body { background-color: #121212; color: #f1f1f1; font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; height: 100dvh; display: flex; flex-direction: column; }
        .timeline-track::-webkit-scrollbar { height: 6px; }
        .timeline-track::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
    </style>
</head>
<body class="h-screen flex flex-col justify-between">

    <!-- TOPO: Player e Botão Tela Cheia / Exportar -->
    <header class="bg-black/90 px-4 py-2 flex justify-between items-center border-b border-zinc-800">
        <div class="flex items-center gap-2">
            <button id="btnFullscreen" class="bg-zinc-800 text-amber-400 text-[10px] px-2 py-1 rounded font-bold border border-amber-500/30">🖥️ Tela Cheia</button>
        </div>
        <div class="flex items-center gap-2">
            <span class="text-[10px] text-zinc-400 font-bold hidden sm:inline">PROJETO CAPCUT WEB</span>
            <button id="btnExport" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-3 py-1 rounded-lg text-xs transition">Exportar</button>
        </div>
    </header>

    <!-- TELA DE PRÉ-VISUALIZAÇÃO (PLAYER) -->
    <div class="flex-1 relative bg-black flex items-center justify-center overflow-hidden">
        <video id="mainVideo" class="max-h-full max-w-full object-contain" playsinline></video>
        <!-- Legenda Estilo CapCut na Tela -->
        <div id="subtitleDisplay" class="absolute bottom-6 left-1/2 -translate-x-1/2 text-center text-white font-black text-xl md:text-2xl drop-shadow-[0_3px_3px_rgba(0,0,0,0.9)] font-['Fredoka'] px-2 pointer-events-none">
            <!-- As legendas automáticas aparecem aqui -->
        </div>
        <!-- Indicador de Tempo do Player -->
        <div class="absolute top-2 left-2 bg-black/60 px-2 py-0.5 rounded text-[10px] text-zinc-300 font-mono">
            <span id="timeDisplay">00:00 / 00:00</span>
        </div>
    </div>

    <!-- LINHA DO TEMPO (TIMELINE) -->
    <div class="bg-zinc-900 border-t border-zinc-800 p-2.5 flex flex-col gap-2">
        <div class="flex justify-between items-center text-xs text-zinc-400">
            <div class="flex items-center gap-2">
                <button id="btnPlayPause" class="w-7 h-7 rounded-full bg-zinc-800 text-white flex items-center justify-center text-xs font-bold">▶</button>
                <label class="bg-zinc-800 hover:bg-zinc-700 text-white px-2.5 py-1 rounded-md cursor-pointer font-semibold text-[11px] flex items-center gap-1">
                    ➕ Adicionar Vídeos
                    <input type="file" id="multiVideoUpload" accept="video/*" multiple class="hidden">
                </label>
            </div>
            <span id="clipCountText" class="text-[10px]">0 clipes</span>
        </div>

        <!-- Trilha de Clipes (Caixinhas do CapCut) -->
        <div id="timelineContainer" class="timeline-track flex gap-2 overflow-x-auto py-1 px-1 bg-zinc-950/80 rounded-xl min-h-[64px] items-center border border-zinc-800">
            <div class="text-zinc-500 text-[11px] italic px-3 select-none">Toque em "Adicionar Vídeos" para juntar vários vídeos na timeline...</div>
        </div>
    </div>

    <!-- BARRA DE FERRAMENTAS INFERIOR (Estilo CapCut) -->
    <nav class="bg-zinc-950 border-t border-zinc-900 grid grid-cols-7 py-2 px-1 text-center text-[10px] text-zinc-400">
        <button id="toolEdit" class="flex flex-col items-center gap-0.5 hover:text-white">
            <span class="text-sm">✂️</span>
            <span>Editar</span>
        </button>
        <button id="toolAudio" class="flex flex-col items-center gap-0.5 hover:text-white">
            <span class="text-sm">🎵</span>
            <span>Áudio</span>
        </button>
        <button id="toolText" class="flex flex-col items-center gap-0.5 hover:text-white">
            <span class="text-sm">✍️</span>
            <span>Texto</span>
        </button>
        <button id="toolEffects" class="flex flex-col items-center gap-0.5 hover:text-white">
            <span class="text-sm">✨</span>
            <span>Efeitos</span>
        </button>
        <button id="toolLayer" class="flex flex-col items-center gap-0.5 hover:text-white">
            <span class="text-sm">🖼️</span>
            <span>Camada</span>
        </button>
        <button id="toolSubtitles" class="flex flex-col items-center gap-0.5 hover:text-amber-400 font-semibold">
            <span class="text-sm">💬</span>
            <span>Legendas</span>
        </button>
        <button id="toolFilters" class="flex flex-col items-center gap-0.5 hover:text-white">
            <span class="text-sm">🎨</span>
            <span>Filtros</span>
        </button>
    </nav>

    <!-- SCRIPT DO APLICATIVO -->
    <script>
        const videoElement = document.getElementById('mainVideo');
        const timelineContainer = document.getElementById('timelineContainer');
        const btnPlayPause = document.getElementById('btnPlayPause');
        const timeDisplay = document.getElementById('timeDisplay');
        const subtitleDisplay = document.getElementById('subtitleDisplay');
        const clipCountText = document.getElementById('clipCountText');
        const btnFullscreen = document.getElementById('btnFullscreen');

        let playlist = [];
        let currentClipIndex = 0;

        // Ativar Tela Cheia Real para sumir com as barras do navegador
        btnFullscreen.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert('Erro ao tentar entrar em tela cheia: ' + err.message);
                });
                btnFullscreen.textContent = '❌ Sair Tela Cheia';
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
                btnFullscreen.textContent = '🖥️ Tela Cheia';
            }
        });

        // Adicionar Vários Vídeos
        document.getElementById('multiVideoUpload').addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            if (playlist.length === 0) {
                timelineContainer.innerHTML = '';
            }

            files.forEach((file) => {
                const videoUrl = URL.createObjectURL(file);
                playlist.push({ url: videoUrl, name: file.name });

                const clipBox = document.createElement('div');
                clipBox.className = 'flex-shrink-0 w-24 h-12 bg-zinc-800 border-2 border-amber-500/60 rounded-lg overflow-hidden relative cursor-pointer flex flex-col justify-end p-1 shadow';
                clipBox.innerHTML = `
                    <div class="text-[8px] text-white font-bold truncate bg-black/70 px-1 rounded">${file.name}</div>
                `;
                
                const assignedIndex = playlist.length - 1;
                clipBox.addEventListener('click', () => {
                    playClip(assignedIndex);
                });

                timelineContainer.appendChild(clipBox);
            });

            clipCountText.textContent = `${playlist.length} clipes`;

            if (playlist.length === files.length) {
                playClip(0);
            }
        });

        function playClip(index) {
            if (index < 0 || index >= playlist.length) return;
            currentClipIndex = index;
            videoElement.src = playlist[currentClipIndex].url;
            videoElement.play();
            btnPlayPause.textContent = '⏸';
        }

        // Passa automaticamente para o próximo vídeo quando um acaba (Juntar sequencial)
        videoElement.addEventListener('ended', () => {
            if (currentClipIndex < playlist.length - 1) {
                playClip(currentClipIndex + 1);
            } else {
                btnPlayPause.textContent = '▶';
            }
        });

        btnPlayPause.addEventListener('click', () => {
            if (playlist.length === 0) {
                alert('Adicione vídeos na timeline primeiro!');
                return;
            }
            if (videoElement.paused) {
                videoElement.play();
                btnPlayPause.textContent = '⏸';
            } else {
                videoElement.paused ? videoElement.play() : videoElement.pause();
                btnPlayPause.textContent = videoElement.paused ? '▶' : '⏸';
            }
        });

        videoElement.addEventListener('timeupdate', () => {
            if (videoElement.duration) {
                timeDisplay.textContent = `${formatTime(videoElement.currentTime)} / ${formatTime(videoElement.duration)}`;
            }
        });

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
        }

        // Legendas Automáticas por Voz
        document.getElementById('toolSubtitles').addEventListener('click', () => {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert('Seu navegador não suporta legendas automáticas.');
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'pt-BR';
            recognition.continuous = true;
            recognition.interimResults = true;

            recognition.onstart = () => {
                subtitleDisplay.textContent = 'Ouvindo áudio...';
            };

            recognition.onresult = (event) => {
                let transcript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    transcript += event.results[i][0].transcript;
                }
                subtitleDisplay.textContent = transcript;
            };

            if (playlist.length > 0) {
                videoElement.play();
                recognition.start();
            } else {
                alert('Carregue um vídeo antes de gerar as legendas.');
            }
        });

        document.getElementById('btnExport').addEventListener('click', () => {
            if (playlist.length === 0) {
                alert('Nenhum vídeo na timeline para exportar.');
                return;
            }
            alert('Projeto pronto e renderizado com sucesso!');
        });
    </script>
</body>
</html>
